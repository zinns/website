# Source of truth for repository labels.
# GitHub does not apply this file automatically. Use it with a label sync tool or the GitHub CLI.

- name: 'type:bug'
  color: 'D73A4A'
  description: 'Broken or incorrect behavior.'
- name: 'type:feature'
  color: '0E8A16'
  description: 'New user-facing behavior.'
- name: 'type:task'
  color: '5319E7'
  description: 'Technical work that is not directly user-facing.'
- name: 'type:design'
  color: 'BFDADC'
  description: 'Visual direction, content, brand, or UX work.'
- name: 'type:docs'
  color: '0075CA'
  description: 'Documentation-only work.'
- name: 'type:refactor'
  color: 'C5DEF5'
  description: 'Code structure changes without intended behavior changes.'
- name: 'type:release'
  color: '0052CC'
  description: 'Release preparation or production release work.'

- name: 'status:triage'
  color: 'FBCA04'
  description: 'Needs review before it is ready for work.'
- name: 'status:ready'
  color: '0E8A16'
  description: 'Ready to be picked up.'
- name: 'status:blocked'
  color: 'B60205'
  description: 'Blocked by an unresolved dependency or decision.'
- name: 'status:needs-info'
  color: 'D4C5F9'
  description: 'Needs more information from the reporter or owner.'
- name: 'status:in-review'
  color: '1D76DB'
  description: 'Implementation is under review.'

- name: 'priority:p0'
  color: 'B60205'
  description: 'Immediate production or release blocker.'
- name: 'priority:p1'
  color: 'D93F0B'
  description: 'High priority work for the current cycle.'
- name: 'priority:p2'
  color: 'FBCA04'
  description: 'Normal priority planned work.'
- name: 'priority:p3'
  color: 'C2E0C6'
  description: 'Low priority or backlog work.'

- name: 'area:web'
  color: '1D76DB'
  description: 'Public website, routing, layout, or shared frontend work.'
- name: 'area:projects'
  color: '84B6EB'
  description: 'Project showcase functionality or content.'
- name: 'area:courses'
  color: '84B6EB'
  description: 'Course functionality or content.'
- name: 'area:auth'
  color: 'C2E0C6'
  description: 'Authentication and authorization.'
- name: 'area:dashboard'
  color: 'C2E0C6'
  description: 'Authenticated user dashboard.'
- name: 'area:automation'
  color: 'F9D0C4'
  description: 'Webhooks, scheduled work, release automation, or backend automations.'
- name: 'area:infra'
  color: 'D4C5F9'
  description: 'Tooling, dependencies, CI, deployment, or repository infrastructure.'
- name: 'area:content'
  color: 'FEF2C0'
  description: 'Copy, metadata, assets, or content structure.'

- name: 'version:patch'
  color: 'C5DEF5'
  description: 'Release candidate should create a patch version.'
- name: 'version:minor'
  color: 'A2EEEF'
  description: 'Release candidate should create a minor version.'
- name: 'version:major'
  color: 'D73A4A'
  description: 'Release candidate should create a major version.'
