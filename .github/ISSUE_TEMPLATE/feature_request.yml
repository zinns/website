name: Feature request
description: Propose new product behavior or a new website capability.
title: '[Feature]: '
labels: ['type:feature', 'status:triage']
body:
  - type: markdown
    attributes:
      value: |
        Use this for user-facing changes such as projects, courses, dashboard behavior, auth flows, and public site capabilities.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What need or limitation should this solve?
      placeholder: Visitors need a way to browse courses before signing in.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed outcome
      description: Describe the expected behavior from the user's point of view.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Public website
        - Projects
        - Courses
        - Auth
        - Dashboard
        - Automation
        - Infrastructure
        - Content
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: What must be true before this issue can be closed?
      placeholder: |
        - Users can ...
        - Empty states are handled
        - Mobile layout is verified
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Add references, screenshots, constraints, or related issues.
    validations:
      required: false
