name: Release Label Guard

on:
  pull_request:
    branches:
      - release
    types:
      - opened
      - synchronize
      - reopened
      - labeled
      - unlabeled
      - edited
      - ready_for_review

permissions:
  contents: read
  pull-requests: read

jobs:
  version-label:
    name: Version Label
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc

      - name: Validate release labels
        run: node .github/scripts/validate-release-labels.mjs
