name: Develop Sync PR

on:
  workflow_run:
    workflows:
      - Publish Release
    types:
      - completed
  release:
    types:
      - published
  workflow_dispatch:

concurrency:
  group: develop-sync-pr
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  create:
    name: Create Develop Sync PR
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc

      - name: Create develop sync PR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node .github/scripts/create-develop-sync-pr.mjs
